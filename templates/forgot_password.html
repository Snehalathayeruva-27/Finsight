<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - FinSight</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f7fc;
        }

        .container{
            width:400px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#2563eb;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        a{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#2563eb;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Forgot Password</h2>

<form method="POST">

<input type="email" name="email" placeholder="Enter Email" required>

<input type="password" name="new_password" placeholder="Enter New Password" required>

<button type="submit">Reset Password</button>

</form>

<a href="/">Back to Login</a>

</div>

</body>
</html>
