<!DOCTYPE html>
<html>

<head>
    <title>Savings - FinSight</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5ff;
        }

        .container{
    width:900px;
    max-width:95%;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px #ccc;
}

        h1 {
            text-align: center;
            color: #2563eb;
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .saving-card {
            margin-top: 25px;
            padding: 15px;
            background: #ecfdf5;
            border-radius: 10px;
        }

        a {}
            .container > a{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2563eb;
}
        .edit-btn{
    display:inline-block !important;
    background:#16a34a !important;
    color:white !important;
    padding:8px 15px !important;
    border-radius:6px !important;
    text-decoration:none !important;
    margin-right:8px !important;
    margin-top:0 !important;
    text-align:center !important;
}

.delete-btn{
    display:inline-block !important;
    background:#dc2626 !important;
    color:white !important;
    padding:8px 15px !important;
    border-radius:6px !important;
    text-decoration:none !important;
    margin-top:0 !important;
    text-align:center !important;
}
.edit-btn,
.delete-btn{
    display:inline-block;
    padding:8px 15px;
    color:white;
    text-decoration:none;
    border-radius:5px;
    margin-right:8px;
    margin-top:0;
    text-align:center;
}

.edit-btn{
    background:#16a34a;
}

.delete-btn{
    background:#dc2626;
}
    </style>

</head>

<body>

<div class="container">

<h1>FinSight</h1>

<h2>💰 Savings</h2>

<form action="/add_savings" method="POST">

    <label>Savings Name</label>
    <input type="text" name="name" placeholder="Enter Savings Name" required>


    <label>Amount</label>
    <input type="number" name="amount" placeholder="Enter Amount" required>


    <label>Category</label>
<select name="category">
    <option>Emergency Fund</option>
    <option>Travel</option>
    <option>Education</option>
    <option>Investment</option>
</select>
 <label>Date</label>
        <input type="date"
               name="date">


    <button type="submit">
        Add Savings
    </button>

</form>


<h3>Recent Savings</h3>

{% if savings %}

<table border="1" width="100%" cellpadding="10">
<tr>
    <th>Name</th>
    <th>Amount</th>
    <th>Date</th>
    <th>Action</th>
</tr>

{% for s in savings %}
<tr>
    <td>{{ s[1] }}</td>
    <td>₹{{ s[2] }}</td>
    <td>{{ s[3] }}</td>
    <td>
        <a href="{{ url_for('edit_savings', id=s[0]) }}" class="edit-btn">Edit</a>
        <a href="{{ url_for('delete_savings', id=s[0]) }}" class="delete-btn"
           onclick="return confirm('Are you sure you want to delete this saving?')">
           Delete
        </a>
    </td>
</tr>
{% endfor %}
    

</table>

{% else %}

<p>No Savings Added</p>

{% endif %}
<br><br>

<a href="/dashboard" style="
display:inline-block;
padding:10px 20px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:8px;">
    ⬅ Back to Dashboard
</a>

</body>

</html>
